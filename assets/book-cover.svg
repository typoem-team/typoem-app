<?xml version="1.0" encoding="UTF-8"?>
<!-- Typoem app icon: one book cover.
     Deep green cover (#2e3d35) with spine shading on the left, a thin inner
     frame, and an italic "T" (Cormorant Garamond Medium Italic, SIL OFL,
     converted to an outline so no font is needed to render this file).
     Transparent background: scripts/build-assets.mjs puts it on cream (#f2eee7).
     The cover stays inside the middle 61% of the canvas, the safe zone of an
     Android adaptive icon. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="cover"><path d="M340 262H674A18 18 0 0 1 692 280V744A18 18 0 0 1 674 762H340A8 8 0 0 1 332 754V270A8 8 0 0 1 340 262Z"/></clipPath>
    <!-- spine: dark edge, a thin highlight where the cover folds -->
    <linearGradient id="spine" gradientUnits="userSpaceOnUse" x1="332" y1="0" x2="366" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".30"/>
      <stop offset=".42" stop-color="#000" stop-opacity=".06"/>
      <stop offset=".56" stop-color="#fff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- soft light from the top left -->
    <radialGradient id="light" gradientUnits="userSpaceOnUse" cx="440" cy="262" r="400">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-20%" width="180%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- long, soft shadow under the book -->
  <rect x="358" y="322" width="320" height="472" rx="18" fill="#1f1b16" opacity=".42" filter="url(#shadow)"/>

  <!-- cover -->
  <path d="M340 262H674A18 18 0 0 1 692 280V744A18 18 0 0 1 674 762H340A8 8 0 0 1 332 754V270A8 8 0 0 1 340 262Z" fill="#2e3d35"/>
  <g clip-path="url(#cover)">
    <rect x="332" y="262" width="360" height="500" fill="url(#light)"/>
    <rect x="332" y="262" width="34" height="500" fill="url(#spine)"/>
  </g>

  <!-- thin inner frame -->
  <rect x="370" y="284" width="300" height="456" rx="3" fill="none" stroke="#f4efe6" stroke-opacity=".26" stroke-width="2"/>

  <!-- italic T -->
  <path transform="translate(404.1 622.8) scale(0.34 -0.34)" fill="#f4efe6" d="M132.8 0Q130.2 0 130.2 6Q130.2 12 132.8 12Q166.6 12 184.5 17Q202.4 22 211.1 37Q219.7 52 224.7 81L306.3 544Q313.3 582.3 304.9 594.1Q296.4 605.8 261.5 605.8H241.3Q203.8 605.8 174.2 589Q144.5 572.2 122.7 539.7Q100.8 507.1 86.7 458.6Q85.7 455.6 80 456.9Q74.2 458.2 75.2 460.6Q79.2 473.5 85.4 497.7Q91.6 521.8 98.4 549.9Q105.1 577.9 111 604Q117 630.1 120 647Q122 650 127.5 649.5Q133 649 132 646Q130 631 145 628Q160 625 171 625Q208 624 257.5 623Q307 622 354 622Q414 622 455 623.5Q496 625 530 625Q558 625 573.5 629.5Q589 634 596 650Q598 653 603 652.5Q608 652 607 648Q603 633.1 596.5 607Q590.1 580.9 583.9 551.9Q577.6 522.8 572.9 497.9Q568.2 473.1 566.2 460.6Q565.2 457.2 559.5 457.7Q553.7 458.2 554.7 462.2Q563.3 509.7 555.9 541.4Q548.5 573.2 524.9 589.5Q501.3 605.8 460.3 605.8H440.5Q405.3 605.8 394.3 592.8Q383.3 579.7 376.7 542L295.7 81Q290.7 52 293.7 37Q296.7 22 313.3 17Q330 12 364.8 12Q366.8 12 366.8 6Q366.8 0 364.8 0Q341.2 0 312.3 1Q283.5 2 248 2Q215.9 2 186.2 1Q156.4 0 132.8 0Z"/>
</svg>
